
name: Universal Android APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -iname "*.zip")

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one ZIP file found."
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Keep only the project ZIP in the repository root."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "Selected: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted
          echo "ZIP extracted successfully."
          find extracted -maxdepth 3 -type f | head -100

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -type f -name "gradlew" | sort)

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            while IFS= read -r file; do
              PROJECT_DIR="$(dirname "$file")"
              break
            done < <(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | sort)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Configure Android SDK
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper not found. Using Gradle 8.9."
            gradle --version
            gradle --no-daemon assembleDebug
          fi

      - name: Verify APK files
        run: |
          APK_COUNT=$(find "${{ steps.project.outputs.project_dir }}" -type f -path "*/build/outputs/apk/*/*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          echo "Generated APK files:"
          find "${{ steps.project.outputs.project_dir }}" -type f -path "*/build/outputs/apk/*/*.apk"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
